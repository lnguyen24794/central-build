services:
  db:
    image: mysql:8.0
    container_name: evoplumb-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: evoplumb
      MYSQL_USER: evoplumb
      MYSQL_PASSWORD: evoplumb
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - evoplumb_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    container_name: evoplumb-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: evoplumb
      WORDPRESS_DB_PASSWORD: evoplumb
      WORDPRESS_DB_NAME: evoplumb
      WORDPRESS_TABLE_PREFIX: wpzh_
      EVO_DOCKER: "1"
    volumes:
      - ./public_html:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  phpmyadmin:
    image: phpmyadmin:5
    container_name: evoplumb-pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: evoplumb
      PMA_PASSWORD: evoplumb

  wpcli:
    image: wordpress:cli-php8.2
    container_name: evoplumb-wpcli
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: evoplumb
      WORDPRESS_DB_PASSWORD: evoplumb
      WORDPRESS_DB_NAME: evoplumb
      WORDPRESS_TABLE_PREFIX: wpzh_
      EVO_DOCKER: "1"
    volumes:
      - ./public_html:/var/www/html
      - ./docker/scripts:/scripts:ro
      - ./.docs:/docs:ro
    user: "33:33"
    entrypoint: ["sleep", "infinity"]

volumes:
  evoplumb_db_data:
